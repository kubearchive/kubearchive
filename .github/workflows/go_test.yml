---
name: go_test
run-name: Unit Tests (go)
on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'
permissions:
  contents: read
  pull-requests: read
  id-token: write
jobs:
  gotest:
    name: "Golang testing"
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.25.5'
      - name: Display Go version
        run: go version
      - name: Generate operator code
        run: |
          bash cmd/operator/generate.sh
          bash cmd/installer/generate.sh
      - name: Build Go code
        run: go build -v ./...
      - name: Test Go code
        run: |
          export KUBEBUILDER_ASSETS=${PWD}/`cmd/operator/bin/setup-envtest use --bin-dir cmd/operator/bin -p path`
          go test -v -coverprofile=coverage.out -covermode=atomic ./...
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          use_oidc: true
          flags: unit-tests
          files: coverage.out
          fail_ci_if_error: false
